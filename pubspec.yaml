name: countersink
description: "A tally counter that keeps count of anything. Your data stays on your phone."
publish_to: 'none'

# NAME+CODE, and the only place the version lives. CODE is derived from NAME
# (major*10000 + minor*100 + patch), as in Ebb and Nexpill.
version: 0.2.1+201

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_zxing: ^3.1.0
  intl: ^0.20.3
  path: ^1.9.1
  qr: ^4.0.0
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  # The app's words, from lib/l10n/*.arb.
  generate: true

  assets:
    - assets/brand/countersink_logo_512.png

  # Bundled, never fetched: Countersink has no network. Both SIL OFL 1.1; the
  # licence texts ship alongside in assets/fonts/.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
