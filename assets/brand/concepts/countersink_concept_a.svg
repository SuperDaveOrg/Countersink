<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Countersink logo, concept A: the screw</title>
  <desc>A countersunk screw seen from above: the clay cone of the countersink around a navy screw head, whose cross slot is a plus sign, the button that counts. The cone is lit from the upper left, which is all that says it slopes. SuperDaveLab family style: flat shapes on a cream badge.</desc>
  <defs>
    <clipPath id="lower"><path d="M 512 0 L 512 512 L 0 512 Z"/></clipPath>
  </defs>
  <!-- Badge, as Ebb, Nexpill and CoreSample -->
  <circle cx="256" cy="256" r="236" fill="#F5F1EA" stroke="#D3CCC1" stroke-width="8"/>
  <!-- The countersink: a cone, lighter on the side the light falls -->
  <circle cx="256" cy="256" r="168" fill="#C4613F"/>
  <circle cx="256" cy="256" r="168" fill="#A84F2F" clip-path="url(#lower)"/>
  <!-- The screw head, cut free of the cone by a cream edge -->
  <circle cx="256" cy="256" r="112" fill="#14344B" stroke="#F5F1EA" stroke-width="12"/>
  <!-- The slot: a plus, leaning as CoreSample's core does -->
  <g transform="rotate(12 256 256)" fill="#F5F1EA">
    <rect x="186" y="238" width="140" height="36" rx="18"/>
    <rect x="238" y="186" width="36" height="140" rx="18"/>
  </g>
</svg>
