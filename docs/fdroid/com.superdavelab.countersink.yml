AutoName: Countersink

RepoType: git
Repo: https://github.com/SuperDaveOrg/Countersink.git

Builds:
  - versionName: 0.1.0
    versionCode: 1001
    commit: COMMIT-OF-v0.1.0
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: https://github.com/SuperDaveOrg/Countersink/releases/download/v%v/countersink-%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ \"(.*)\"/\1/p" .github/workflows/ci.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export repo=/tmp/countersink-build
      - cd ..
      - mv com.superdavelab.countersink $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - popd
      - mv $repo com.superdavelab.countersink
    scandelete:
      - .pub-cache
    build:
      - export repo=/tmp/countersink-build
      - cd ..
      - mv com.superdavelab.countersink $repo
      - pushd $repo
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform android-arm
      - popd
      - mv $repo com.superdavelab.countersink

